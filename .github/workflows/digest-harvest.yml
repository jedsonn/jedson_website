name: Digest harvest (artifact + transit)

# Harvest runs on GitHub's runners because they have open internet; a Claude
# session (sandbox / cloud / Routine) CANNOT reach Crossref/arXiv/OpenAlex.
# This job harvests, enriches, prepares batches for the NEW papers only, and
# drops them onto the throwaway `digest-raw` branch. The daily Routine then
# fetches digest-raw, classifies (the LLM step), strips abstracts, publishes a
# clean edition to main, and deletes digest-raw. Abstracts live only in the
# artifact and on digest-raw (transient) — NEVER on main.
#
# Runs at 02:00 UTC to leave an ~8h buffer before the 10:00 UTC (~5am Central)
# publish Routine. GitHub's scheduled runs can be delayed by hours under load;
# on 2026-07-27 a 07:00 cron fired at 10:43 — AFTER the 10:00 Routine — so that
# day's edition never got classified. The early start keeps a multi-hour delay
# from pushing the harvest past the Routine again.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: digest-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -q -r digest/requirements.txt

      - name: Harvest, enrich, prepare batches for NEW papers
        id: h
        run: |
          set -euo pipefail
          cd digest
          RUN_DATE=$(date -u +%F)
          EDITION=$(python3 -c "import json,os;print(json.load(open('data/last-run.json'))['edition']+1 if os.path.exists('data/last-run.json') else 1)")
          echo "edition=$EDITION" >> "$GITHUB_OUTPUT"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"
          echo "Edition $EDITION on $RUN_DATE"
          python3 scripts/harvest.py --edition "$EDITION" --date "$RUN_DATE"
          RUN_DIR=$(printf "data/runs/edition-%03d" "$EDITION")
          KEPT=$(python3 -c "import json;print(len(json.load(open('$RUN_DIR/harvested.json'))))" 2>/dev/null || echo 0)
          echo "Harvested $KEPT raw records."
          if [ "$KEPT" = "0" ]; then
            echo "empty=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 scripts/enrich.py --edition "$EDITION"
          python3 scripts/classify.py prepare --edition "$EDITION" --batch-size 8
          NEW=$(python3 -c "import json;print(json.load(open('$RUN_DIR/batch-manifest.json')).get('to_classify',0))" 2>/dev/null || echo 0)
          echo "New papers to classify (not already in index): $NEW"
          if [ "$NEW" = "0" ]; then
            echo "empty=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload edition artifact (backup; abstracts here, not on main)
        if: steps.h.outputs.empty != '1'
        uses: actions/upload-artifact@v4
        with:
          name: digest-edition-${{ steps.h.outputs.edition }}
          path: digest/data/runs/edition-*
          retention-days: 5
          if-no-files-found: error

      - name: Expose batches on digest-raw (transit; deleted after classify)
        if: steps.h.outputs.empty != '1'
        run: |
          set -euo pipefail
          git config user.name "digest-bot"
          git config user.email "noreply@anthropic.com"
          RUN_DIR=$(printf "digest/data/runs/edition-%03d" "${{ steps.h.outputs.edition }}")
          git checkout --orphan digest-raw
          git reset -q
          echo "${{ steps.h.outputs.edition }}" > EDITION.txt
          echo "${{ steps.h.outputs.run_date }}" > RUN_DATE.txt
          git add -f EDITION.txt RUN_DATE.txt "$RUN_DIR"
          git commit -q -m "Transit batches edition ${{ steps.h.outputs.edition }} (abstracts; do not merge; deleted after classify)"
          git push -f origin digest-raw
          echo "Pushed batches to digest-raw for edition ${{ steps.h.outputs.edition }}."
